<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: sans-serif;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 16px 0;
      }
      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .add-btn {
        background: #4a90d9;
        color: white;
      }
      .delete-btn {
        background: #e74c3c;
        color: white;
        padding: 4px 8px;
        font-size: 0.8rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      li span {
        flex: 1;
        word-break: break-all;
      }
      .empty {
        color: #888;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Site Blocker</h1>
    <div class="input-group">
      <input type="text" id="url-input" placeholder="例: x.com" />
      <button class="add-btn" id="add-btn">追加</button>
    </div>
    <ul id="site-list"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
